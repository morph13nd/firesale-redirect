<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firesale eBay OAuth Redirect</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #000; color: #fff; }
    .container { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #00C805; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #8F8F8F; font-size: 0.875rem; }
    .error { color: #FF5000; }
  </style>
</head>
<body>
  <div class="container">
    <div id="content">
      <div class="spinner"></div>
      <h1>Connecting to Firesale...</h1>
      <p>Redirecting you back to the app</p>
    </div>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var content = document.getElementById('content');

      if (error) {
        content.innerHTML = '<h1 class="error">Authorization Failed</h1><p>' + error + '</p><p>You can close this page and try again.</p>';
        return;
      }

      if (code) {
        // Redirect to the Firesale app's custom URL scheme
        window.location.href = 'firesale://callback?code=' + encodeURIComponent(code);
        // Show fallback after 2 seconds in case the redirect doesn't fire
        setTimeout(function() {
          content.innerHTML = '<h1>Almost done!</h1><p>If the app didn\\'t open automatically, copy this code and paste it in Firesale:</p><textarea readonly style="width:100%;max-width:400px;height:80px;margin-top:1rem;font-size:0.75rem;padding:0.5rem;border:1px solid #333;border-radius:8px;background:#111;color:#fff;" onclick="this.select()">' + code + '</textarea>';
        }, 2000);
      } else {
        content.innerHTML = '<h1 class="error">No Code Received</h1><p>No authorization code was found. Please try again from the Firesale app.</p>';
      }
    })();
  </script>
</body>
</html>
